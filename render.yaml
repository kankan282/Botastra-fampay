services:
  - type: web
    name: botastra-fampay-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: botastra-fampay-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_KEY_CREATION
        value: "true"
      - key: PUBLIC_KEY_MAX_TTL_DAYS
        value: "30"
      - key: DEFAULT_KEY_TTL_DAYS
        value: "7"
      - key: DEFAULT_ALLOWED_SENDERS
        value: "fampay.in,famapp.in"
      - key: REQUIRE_AUTHENTICATED_EMAIL
        value: "true"
      - key: DYNAMIC_PAYMENT_WINDOW_MINUTES
        value: "15"
      - key: UTR_LOOKBACK_DAYS
        value: "30"

databases:
  - name: botastra-fampay-db
    databaseName: botastra_fampay
    user: botastra_fampay
    plan: free
